format_version = 7
id = "sf.enhancement.widescreen"
version = "1.0.0"
name = "Syphon Filter Widescreen"
author = "danilopaulinodasilva"
description = "Renders Syphon Filter with a wider field of view using its game-specific culling and UI hooks."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94240"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Enable Syphon Filter's widescreen rendering and choose a fixed or resize-driven aspect."
group = "Display"
channel = "experimental"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Adaptive follows the live window size from 4:3 through 21:9."
group = "Display"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "adaptive"
label = "Adaptive"

[[plugin]]
feature = "widescreen"
id = "sf.widescreen.16-9"
when = { aspect = "16:9" }

[[plugin]]
feature = "widescreen"
id = "sf.widescreen.21-9"
when = { aspect = "21:9" }

[[plugin]]
feature = "widescreen"
id = "sf.widescreen.adaptive"
when = { aspect = "adaptive" }
