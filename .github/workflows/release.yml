# Source-only releases. The game is recompiled from the player's own disc at
# build time (README), so CI has nothing game-derived to build or ship: a tag
# vX.Y.Z publishes a GitHub Release with that version's CHANGELOG section and
# a source zip that includes the submodules.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for ${VER}"
            exit 1
          fi

      - name: Source zip with submodules
        shell: bash
        run: |
          set -euo pipefail
          NAME="SyphonFilterRecomp-${GITHUB_REF_NAME}-source"
          if git ls-files --error-unmatch generated >/dev/null 2>&1; then
            echo "::error::generated/ is tracked; it must never ship"
            exit 1
          fi
          git ls-files --recurse-submodules >files.txt
          mkdir -p "dist/${NAME}"
          rsync -a --files-from=files.txt . "dist/${NAME}/"
          (cd dist && zip -qr "${NAME}.zip" "${NAME}")

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/SyphonFilterRecomp-${GITHUB_REF_NAME}-source.zip" \
            --title "Syphon Filter Recompiled ${GITHUB_REF_NAME}" \
            --notes-file notes.md --prerelease
